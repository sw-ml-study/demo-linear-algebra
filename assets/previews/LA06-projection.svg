<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img"><title>Orthogonal projection and residual</title><desc>Vector v equals its shadow on direction b plus a perpendicular residual. A right-angle marker and zero dot-product label verify orthogonality.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0caf5"/></marker></defs><style>text{font-family:monospace;fill:#c0caf5}.axis{stroke:#565f89;stroke-width:2}.v{fill:none;stroke-width:5;marker-end:url(#a)}.original{stroke:#7aa2f7}.projection{stroke:#9ece6a}.residual{stroke:#f7768e}.guide{stroke:#e0af68;stroke-width:3;stroke-dasharray:8 6}.right{fill:none;stroke:#c0caf5;stroke-width:2}.panel{fill:#24283b;stroke:#414868;stroke-width:2}</style><rect width="900" height="420" fill="#1a1b26"/><rect class="panel" x="25" y="55" width="850" height="330" rx="14"/><text x="35" y="32" font-size="20">v=[3,1] = projection [2,2] + residual [1,-1]</text><path class="axis" d="M75 315H830M150 365V80"/><path class="guide" d="M85 360L630 90"/><path class="v original" d="M150 315L630 235"/><path class="v projection" d="M150 315L470 155"/><path class="v residual" d="M470 155L630 235"/><path class="right" d="M453 164L470 181L487 172"/><text x="565" y="220">v</text><text x="295" y="205">projection onto b=[1,1]</text><text x="515" y="145">residual</text><text x="450" y="350" text-anchor="middle">dot(residual,b)=0; reconstruction error=0</text><text x="450" y="375" text-anchor="middle">projecting onto [0,0] returns Err(zero_direction)</text></svg>