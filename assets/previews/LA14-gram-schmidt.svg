<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img"><title>Classical Gram-Schmidt subtracts a projection</title><desc>The second input column splits into its projection on the first unit column and a perpendicular residual. Independent panels report orthogonality and reconstruction.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0caf5"/></marker></defs><style>text{font-family:monospace;fill:#c0caf5}.p{fill:#24283b;stroke:#414868}.v{fill:none;stroke-width:5;marker-end:url(#a)}.b{stroke:#7aa2f7}.pink{stroke:#f7768e}.gold{stroke:#e0af68}.g{stroke:#9ece6a}.ok{fill:#9ece6a}</style><rect width="980" height="470" fill="#1a1b26"/><text x="30" y="32">a2 = projection on q1 + perpendicular residual</text><rect class="p" x="20" y="60" width="580" height="330"/><path class="v b" d="M100 330L350 330"/><path class="v pink" d="M100 330L350 100"/><path class="v gold" d="M100 330L350 330"/><path class="v g" d="M350 330L350 100"/><text x="210" y="360">q1 / projection</text><text x="360" y="220">residual to q2</text><rect class="p" x="630" y="60" width="330" height="330"/><text x="655" y="105">Q=[[1,0],[0,1],[0,0]]</text><text x="655" y="150">R=[[1,1],[0,1]]</text><text class="ok" x="655" y="220">||Q^TQ-I||F = 0</text><text class="ok" x="655" y="265">||QR-A||F = 0</text><text x="655" y="325">positive R diagonal</text><text x="655" y="360">max shape [3,2]</text><text x="490" y="445" text-anchor="middle">dependent residual at or below tolerance returns Err; bounded teaching code only</text></svg>