<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img"><title>Successive matrix transforms equal one composed transform</title><desc>An input grid is scaled by B and then sheared by A. The resulting pink grid and vector [8,6] match the grid and vector produced directly by AB, while reversing the order reaches [6,6].</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0caf5"/></marker></defs><style>text{font-family:monospace;fill:#c0caf5}.p{fill:#24283b;stroke:#414868;stroke-width:2}.g{fill:none;stroke:#565f89;stroke-width:2}.b{stroke:#7aa2f7}.c{stroke:#f7768e}.v{fill:none;stroke-width:5;marker-end:url(#a)}.arrow{fill:#e0af68;font-size:28px}.bad{fill:#bb9af7}</style><rect width="960" height="470" fill="#1a1b26"/><text x="30" y="32" font-size="20">A(Bx) = (AB)x = [8,6], but B(Ax) = [6,6]</text><rect class="p" x="20" y="60" width="270" height="300" rx="14"/><text x="40" y="90">1. input x=[1,2]</text><path class="g" d="M50 320H260M50 270H260M50 220H260M50 170H260M80 340V110M130 340V110M180 340V110M230 340V110"/><path class="v b" d="M80 320L130 220"/><text class="arrow" x="300" y="220">→ B →</text><rect class="p" x="370" y="60" width="270" height="300" rx="14"/><text x="390" y="90">2. Bx=[2,6]</text><path class="g b" d="M400 320H610M400 260H610M400 200H610M400 140H610M430 340V110M500 340V110M570 340V110"/><path class="v b" d="M430 320L500 140"/><text class="arrow" x="650" y="220">→ A →</text><rect class="p" x="720" y="60" width="220" height="300" rx="14"/><text x="740" y="90">3. A(Bx)</text><path class="g c" d="M740 320L910 235M740 270L910 185M740 220L910 135M770 340L900 145M820 340L930 175"/><path class="v c" d="M750 325L900 145"/><text x="830" y="390" text-anchor="middle">same pink result from (AB)x</text><text class="bad" x="480" y="435" text-anchor="middle">order matters: BA maps x to the different point [6,6]</text></svg>