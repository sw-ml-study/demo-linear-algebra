<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360" role="img"><title>Vector addition and scaling</title><desc>On a coordinate grid, blue vector x followed head to tail by green vector y reaches the same endpoint as pink x plus y. Below, twice x points in the same direction with twice the component values.</desc><defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c0caf5"/></marker></defs><style>text{font-family:monospace;fill:#c0caf5}.grid{stroke:#414868;stroke-width:1}.axis{stroke:#a9b1d6;stroke-width:2}.v{fill:none;stroke-width:5;marker-end:url(#arrowhead)}.x{stroke:#7aa2f7}.y{stroke:#9ece6a}.sum{stroke:#f7768e}.scale{stroke:#bb9af7}</style><rect width="820" height="360" fill="#1a1b26"/><path class="grid" d="M40 40H780M40 80H780M40 120H780M40 160H780M40 200H780M40 240H780M40 280H780M40 320H780M80 20V340M120 20V340M160 20V340M200 20V340M240 20V340M280 20V340M320 20V340M360 20V340M400 20V340M440 20V340M480 20V340M520 20V340M560 20V340M600 20V340M640 20V340M680 20V340M720 20V340M760 20V340"/><path class="axis" d="M40 240H780M120 20V340"/><text x="40" y="28">x=[2,1], y=[1,2], x+y=[3,3]</text><path class="v x" d="M120 240L280 200"/><path class="v y" d="M280 200L360 120"/><path class="v sum" d="M120 240L360 120"/><text x="210" y="232">x</text><text x="325" y="178">y</text><text x="350" y="105">x+y</text><text x="430" y="70">2*x=[4,2]: same direction, twice each component</text><path class="v x" d="M440 280L540 240"/><path class="v scale" d="M440 280L640 200"/><text x="520" y="300">x</text><text x="625" y="185">2*x</text></svg>