<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img"><title>Bounded power iteration exposes convergence and failure</title><desc>A separated dominant diagonal matrix aligns iterates toward one axis while residual falls. A rotation cycles until the iteration limit, and identity has zero residual but no unique dominant direction.</desc><style>text{font-family:monospace;fill:#c0caf5}.p{fill:#24283b;stroke:#414868}.b{stroke:#7aa2f7}.g{stroke:#9ece6a}.bad{fill:#f7768e}.gold{fill:#e0af68}.v{stroke-width:5}.axis{stroke:#565f89}</style><rect width="1000" height="470" fill="#1a1b26"/><text x="30" y="32">bounded 2x2 power iteration: residual and limit stay visible</text><rect class="p" x="20" y="60" width="310" height="330"/><text x="40" y="92">diag(2,1): CONVERGED</text><path class="axis" d="M70 320H290M100 350V120"/><path class="v b" d="M100 320L220 200"/><path class="v g" d="M100 320L280 315"/><text x="45" y="370">residual &lt; 0.01 before limit 16</text><rect class="p" x="345" y="60" width="310" height="330"/><text x="365" y="92">90-degree rotation: LIMIT</text><path class="axis" d="M390 270H610M500 350V120"/><path class="v b" d="M500 270L600 270"/><path class="v g" d="M500 270L500 150"/><text class="bad" x="380" y="370">6 steps, residual=1, cycles</text><rect class="p" x="670" y="60" width="310" height="330"/><text x="690" y="92">identity: AMBIGUOUS</text><path class="axis" d="M715 320H940M750 350V120"/><path class="v b" d="M750 320L900 170"/><text class="gold" x="695" y="370">tiny residual; every direction eigen</text><text x="500" y="445" text-anchor="middle">largest-magnitude component is nonnegative; this does not order a general spectrum</text></svg>