<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img"><title>Linear combinations and span</title><desc>Independent horizontal and vertical basis arrows generate a grid of points across a plane. Dependent arrows lie on one line, and two different coefficient pairs reach the same point.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0caf5"/></marker></defs><style>text{font-family:monospace;fill:#c0caf5}.grid{stroke:#414868;stroke-width:1}.v{fill:none;stroke-width:5;marker-end:url(#a)}.first{stroke:#7aa2f7}.second{stroke:#9ece6a}.target{fill:#f7768e}.line{stroke:#e0af68;stroke-width:3}.panel{fill:#24283b;stroke:#414868;stroke-width:2}</style><rect width="900" height="420" fill="#1a1b26"/><rect class="panel" x="20" y="50" width="420" height="340" rx="14"/><rect class="panel" x="460" y="50" width="420" height="340" rx="14"/><text x="30" y="30" font-size="20">INDEPENDENT: PLANE</text><path class="grid" d="M50 100H410M50 150H410M50 200H410M50 250H410M50 300H410M100 70V370M150 70V370M200 70V370M250 70V370M300 70V370M350 70V370M400 70V370"/><path class="v first" d="M200 250L350 250"/><path class="v second" d="M200 250L200 100"/><circle class="target" cx="350" cy="100" r="9"/><text x="240" y="275">e1=[1,0]</text><text x="90" y="115">e2=[0,1]</text><text x="265" y="90">2*e1 + 3*e2</text><text x="470" y="30" font-size="20">DEPENDENT: LINE</text><path class="line" d="M490 335L850 95"/><path class="v first" d="M540 300L650 226"/><path class="v second" d="M540 300L760 153"/><circle class="target" cx="760" cy="153" r="9"/><text x="500" y="355">b=[1,2], 2b=[2,4]</text><text x="510" y="105">4*b + 0*(2b) = 2*b + 1*(2b) = [4,8]</text><text x="670" y="385" text-anchor="middle">det([b,2b]) = 0 witnesses dependence</text></svg>